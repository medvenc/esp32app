<!DOCTYPE html>
<html>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'>
    <title>Speed Controller</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #121212; color: #ffffff; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100dvh; min-height: -webkit-fill-available; padding: 1.5vh; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }
        
        /* JAVÍTÁS: Külső fehér keret, és szigorúan vh alapú maximális magasság a képernyőhöz igazítva */
        .container {
            width: 100%; max-width: 440px; background: #1e1e1e;
            border-radius: 24px; border: 1px solid #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;
            overflow: hidden; display: flex; flex-direction: column;
            height: 94vh; height: 94dvh; /* Kényszerített képernyőhöz tapadás */
        }
        
        /* JAVÍTÁS: Felső sáv határozott, tiszta fehér vízszintes elválasztó vonallal */
        .top-bar {
            display: flex; align-items: center; justify-content: flex-end;
            width: 100%; height: 48px; padding: 0 15px;
            background: #181818; border-bottom: 1px solid #ffffff;
            flex-shrink: 0;
        }
        
        .btn-exit-square {
            width: 32px; height: 32px; font-size: 1.1rem; font-weight: bold;
            border: 2px solid #ffffff; background: transparent; color: #ffffff;
            border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; line-height: 1; padding-bottom: 2px;
        }
        .btn-exit-square:active { background: rgba(255, 255, 255, 0.1); }
        
        /* Teljesen rugalmas belső tartalomeloszlás vh-ban számolva */
        .main-content { 
            padding: 2.5vh 20px; width: 100%; 
            display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1;
            height: calc(100% - 48px);
        }
        
        h2 { font-size: clamp(1.6rem, 6vw, 2.2rem); color: #00adb5; font-weight: 600; text-align: center; margin-bottom: 0.5vh; }
        p { color: #888; margin-bottom: 2vh; font-size: clamp(0.9rem, 4vw, 1.1rem); }
        
        .controls-row {
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            margin-bottom: 2vh; width: 100%; flex-shrink: 0;
        }
        .dir-box {
            width: clamp(52px, 14vw, 60px); height: clamp(52px, 14vw, 60px); 
            background: #252525; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; border: 2px solid transparent;
        }
        .arrow { width: 60%; height: 60%; fill: #444; transition: all 0.3s ease; }
        
        .dir-box.active-fwd { background: rgba(0, 230, 118, 0.1); border-color: #00e676; box-shadow: 0 0 10px rgba(0, 230, 118, 0.3); }
        .dir-box.active-fwd .arrow { fill: #00e676; }
        .dir-box.active-rev { background: rgba(255, 23, 68, 0.1); border-color: #ff1744; box-shadow: 0 0 10px rgba(255, 23, 68, 0.3); }
        .dir-box.active-rev .arrow { fill: #ff1744; }
        .dir-box.inactive { background: #181818; border-color: #2da1a722; }
        .dir-box.inactive .arrow { fill: #333; opacity: 0.3; }

        .btn-dir {
            flex: 1; padding: 12px 10px; font-size: clamp(0.95rem, 4vw, 1.1rem); font-weight: bold;
            border: 2px solid #00adb5; background: #393e46; color: #00adb5; 
            border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
            height: clamp(52px, 14vw, 60px); display: flex; align-items: center; justify-content: center;
        }
        .btn-dir:disabled { background: #222831; color: #555; border: 2px solid #444; opacity: 0.3; cursor: not-allowed; }

        .fade-zone {
            opacity: 0.25; filter: blur(3px); pointer-events: none;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1;
        }
        .fade-zone.active { opacity: 1; filter: blur(0px); pointer-events: auto; }

        .slider-section { margin-bottom: 2vh; text-align: left; width: 100%; }
        
        /* JAVÍTÁS: Megnövelt alsó térköz (margin-bottom: 18px), hogy a feliratok jóval feljebb legyenek a csúszka gombjától */
        .slider-label { font-size: clamp(1.05rem, 4vw, 1.2rem); color: #aaa; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
        .target-val { font-size: clamp(1.05rem, 4vw, 1.2rem); font-weight: bold; color: #ffffff; }
        .power-val { font-size: clamp(1.05rem, 4vw, 1.2rem); font-weight: bold; color: #ffffff; }
        
        .slider-container { width: 100%; position: relative; }
        input[type=range] { -webkit-appearance: none; width: 100%; height: 10px; border-radius: 10px; background: #333; outline: none; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 34px; height: 34px; border-radius: 50%;
            background: #00adb5; cursor: pointer; box-shadow: 0 0 8px rgba(0, 173, 181, 0.5);
        }
        #ledSlider::-webkit-slider-thumb { width: 44px; height: 44px; }
        
        .value-display { font-size: clamp(3.5rem, 14vw, 5rem); font-weight: bold; margin-bottom: 0.2vh; display: flex; align-items: center; justify-content: center; height: 75px; width: 100%; }
        .value-title { font-size: clamp(0.75rem, 3.5vw, 0.85rem); color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2vh; }
        
        .status-symbol { display: inline-block; text-align: center; line-height: 1; user-select: none; }
        .state-stop { color: #ff1744; text-shadow: 0 0 12px rgba(255, 23, 68, 0.4); }
        .state-up { color: #00e676; text-shadow: 0 0 12px rgba(0, 230, 118, 0.5); animation: blink 0.5s ease-in-out infinite alternate; }
        .state-down { color: #ff1744; text-shadow: 0 0 12px rgba(255, 23, 68, 0.5); animation: blink 0.5s ease-in-out infinite alternate; }
        .state-const { color: #00e676; text-shadow: 0 0 12px rgba(0, 230, 118, 0.4); animation: blink 0.5s ease-in-out infinite alternate; }
        
        @keyframes blink {
            0% { opacity: 0.15; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* JAVÍTÁS: Nagyobb, hangsúlyos felső térköz (margin-top: auto és padding), ami maximális távolságra löki el a STOP gombot az Inertia csúszkától */
        .btn-off {
            width: 100%; padding: clamp(14px, 4vw, 18px); font-size: clamp(1.15rem, 4.5vw, 1.3rem); font-weight: bold;
            border: none; border-radius: 12px; cursor: pointer; background: #ff2e63; color: white;
            box-shadow: 0 4px 12px rgba(255, 46, 99, 0.4); margin-top: auto; padding-top: 16px; padding-bottom: 16px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <button class="btn-exit-square" onclick="exitApplication()">X</button>
        </div>
        
        <div class="main-content">
            <h2>Speed Controller</h2>
            <p id="statusTxt">Bluetooth: Disconnected</p>
            
            <div class="controls-row">
                <div class="dir-box" id="boxLeft"><svg class="arrow" viewBox="0 0 24 24"><path d="M14,7l-5,5l5,5V7Z"/></svg></div>
                <button class="btn-dir" id="connectBtn" onclick="connectBluetooth()">CONNECT</button>
                <div class="dir-box" id="boxRight"><svg class="arrow" viewBox="0 0 24 24"><path d="M10,17l5,-5l-5,-5V17Z"/></svg></div>
            </div>

            <div id="fadeZoneArea" class="fade-zone">
                <div class="value-display">
                    <span id="centerIcon" class="status-symbol state-stop">●</span>
                </div>
                <div class="value-title">Train Status</div>
                
                <div class="slider-section">
                    <div class="slider-label"><span>Speed:</span><span class="target-val" id="targetNum">0%</span></div>
                    <div class="slider-container">
                        <input type='range' id='ledSlider' min='0' max='100' value='0' oninput='handleSliderThrottle(this.value)' onchange='sendFinalValue(this.value)' disabled>
                    </div>
                </div>

                <div class="slider-section">
                    <div class="slider-label"><span>Inertia:</span><span class="power-val" id="dynTxt">0%</span></div>
                    <div class="slider-container">
                        <input type='range' id='dynSlider' min='0' max='100' value='0' oninput='handleWeightThrottle(this.value)' onchange='sendFinalWeight(this.value)' disabled>
                    </div>
                </div>
                
                <button class="btn-off" id="brakeBtn" onclick="turnOff()" disabled>STOP</button>
            </div>
        </div>
    </div>
    <script>
        const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const WRITE_UUID   = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
        const NOTIFY_UUID  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

        let bleCharacteristic = null;
        let bleDevice = null;
        let isForward = true;
        const encoder = new TextEncoder();

        let lastSpeedTime = 0;
        let lastWeightTime = 0;
        
        let currentTargetSpeed = 0;
        let currentTrainState = "E"; 

        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        async function connectBluetooth() {
            const statusTxt = document.getElementById('statusTxt');
            const connectBtn = document.getElementById('connectBtn');
            try {
                connectBtn.innerText = "CONNECTING...";
                statusTxt.innerText = "Searching for C3-SUPERMINI...";
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: "C3-SUPERMINI" }],
                    optionalServices: [SERVICE_UUID]
                });

                statusTxt.innerText = "Connecting...";
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(WRITE_UUID);

                const notifyChar = await service.getCharacteristic(NOTIFY_UUID);
                await notifyChar.startNotifications();
                notifyChar.addEventListener('characteristicvaluechanged', handleNotifications);

                statusTxt.innerText = "Connected";
                connectBtn.innerText = "DIRECTION";
                connectBtn.onclick = toggleDirection;
                
                document.getElementById('fadeZoneArea').className = "fade-zone active";
                
                document.getElementById('ledSlider').disabled = false;
                document.getElementById('dynSlider').disabled = false;
                document.getElementById('brakeBtn').disabled = false;
                
                isForward = true;
                updateVisuals();
                updateCenterDisplay(); 

                if(bleCharacteristic) { await bleCharacteristic.writeValue(encoder.encode('D0')); }
                await requestWakeLock();

                bleDevice.addEventListener('gattserverdisconnected', () => {
                    releaseWakeLock(); 
                    statusTxt.innerText = "Disconnected";
                    location.reload();
                });
            } catch (error) { 
                statusTxt.innerText = "Error: " + error.message; 
                connectBtn.innerText = "CONNECT"; 
            }
        }

        async function exitApplication() {
            if (bleCharacteristic) {
                try { await bleCharacteristic.writeValue(encoder.encode('X')); } catch(e) {}
            }
            releaseWakeLock();
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
            }
            document.body.innerHTML = "<div style='font-size:1.5rem;color:#666;font-family:sans-serif;text-align:center;margin-top:40vh;'>Application Closed.</div>";
        }

        function handleNotifications(event) {
            let decoder = new TextDecoder('utf-8');
            let msg = decoder.decode(event.target.value).trim();
            
            if(msg === "DIR_FWD") { isForward = true; updateVisuals(); } 
            else if(msg === "DIR_REV") { isForward = false; updateVisuals(); }
            else if(msg === "U" || msg === "D" || msg === "E") {
                currentTrainState = msg; 
                updateCenterDisplay();
                
                const isTrainTotallyStopped = (currentTargetSpeed === 0 && currentTrainState === "E");
                document.getElementById('connectBtn').disabled = !isTrainTotallyStopped;
            }
        }

        function updateCenterDisplay() {
            const icon = document.getElementById('centerIcon');
            
            if (currentTargetSpeed === 0 && currentTrainState === "E") {
                icon.innerText = "●";
                icon.className = "status-symbol state-stop";
            } 
            else if (currentTrainState === "U") {
                icon.innerText = "▲";
                icon.className = "status-symbol state-up";
            } 
            else if (currentTrainState === "D") {
                icon.innerText = "▼";
                icon.className = "status-symbol state-down";
            } 
            else if (currentTrainState === "E" && currentTargetSpeed > 0) {
                icon.innerText = "●";
                icon.className = "status-symbol state-const";
            }
        }

        function updateVisuals() {
            var boxL = document.getElementById('boxLeft');
            var boxR = document.getElementById('boxRight');
            if(isForward) { boxR.className = "dir-box active-fwd"; boxL.className = "dir-box inactive"; } 
            else { boxL.className = "dir-box active-rev"; boxR.className = "dir-box inactive"; }
        }

        function handleSliderThrottle(val) {
            currentTargetSpeed = parseInt(val);
            document.getElementById('targetNum').innerText = val + '%';
            document.getElementById('connectBtn').disabled = true;
            updateCenterDisplay(); 
            
            const now = Date.now();
            if (now - lastSpeedTime > 250) { 
                sendBluetoothCommand('V' + val);
                lastSpeedTime = now;
            }
        }

        async function sendFinalValue(val) {
            currentTargetSpeed = parseInt(val);
            updateCenterDisplay();
            await sendBluetoothCommand('V' + val);
        }

        function handleWeightThrottle(val) {
            document.getElementById('dynTxt').innerText = val + '%';
            const now = Date.now();
            if (now - lastWeightTime > 300) {
                sendBluetoothCommand('D' + val);
                lastWeightTime = now;
            }
        }

        async function sendFinalWeight(val) {
            await sendBluetoothCommand('D' + val);
        }

        async function sendBluetoothCommand(payload) {
            if(bleCharacteristic) { try { await bleCharacteristic.writeValue(encoder.encode(payload)); } catch(e){} }
        }
        
        function toggleDirection() { 
            isForward = !isForward;
            updateVisuals();
            sendBluetoothCommand('T');
        }
        
        async function turnOff() {
            currentTargetSpeed = 0;
            currentTrainState = "E";
            document.getElementById('ledSlider').value = 0;
            document.getElementById('targetNum').innerText = '0%';
            document.getElementById('connectBtn').disabled = false;
            updateCenterDisplay();
            if(bleCharacteristic) { try { await bleCharacteristic.writeValue(encoder.encode('X')); } catch(e){} }
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'hidden') {
                releaseWakeLock();
            } else if (bleCharacteristic && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        updateVisuals();
    </script>
</body>
</html>
